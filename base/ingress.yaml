# No host here: the cloud overlay adds the domain and TLS.
# Same host as the backend ingress: /api and /tiles are more specific and win over /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
